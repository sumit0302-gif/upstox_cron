name: Refresh NSE technicals

# 11:30 UTC = 17:00 IST, weekdays only.
# NSE closes 15:30 IST (10:00 UTC), so this runs 90 minutes after the close on a
# settled daily candle. Mon-Fri only: a weekend run would just re-commit
# Friday's identical data.
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed JSON back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Collect technicals
        run: python collect_technicals.py --out technicals.json
        # For all 499 instead of the 20 leaders:
        # run: python collect_technicals.py --csv nifty500.csv --out technicals.json

      - name: Fail if the run came back empty
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("technicals.json"))
          ok, bad = d["count"], len(d["failures"])
          print(f"{ok} collected, {bad} failed")
          for f in d["failures"]:
              print("  FAILED", f["symbol"], "-", f["error"])
          # A few duds are tolerable; a mostly-empty file is not — better to keep
          # last week's good data than commit a broken refresh.
          if ok == 0 or bad > ok:
              sys.exit("refusing to commit: too many failures")
          PY

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technicals.json
          if git diff --staged --quiet; then
            echo "no change — nothing to commit"
          else
            git commit -m "technicals: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
